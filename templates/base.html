<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}A&E Painéis | Soluções Elétricas Industriais{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="{% block meta_description %}Projetos sob medida em painéis elétricos industriais, barramentos e máquinas especiais. Atendimento técnico com padrão industrial.{% endblock %}">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://aepaineis.com.br{{ request.path }}">

  <!-- Open Graph (WhatsApp / Facebook) -->
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="A&E Painéis">
  <meta property="og:title" content="{% block og_title %}A&E Painéis - Soluções Elétricas Industriais{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Painéis elétricos, barramentos e máquinas especiais com padrão técnico e acabamento superior.{% endblock %}">
  <meta property="og:url" content="https://aepaineis.com.br{{ request.path }}">
  <meta property="og:image" content="https://aepaineis.com.br/static/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter (opcional) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}A&E Painéis - Soluções Elétricas Industriais{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Painéis elétricos, barramentos e máquinas especiais com padrão industrial.{% endblock %}">
  <meta name="twitter:image" content="https://aepaineis.com.br/static/img/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='img/logos/logo-style.png') }}">
  <!-- (Opcional) ícone para iPhone -->
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logos/logo-style.png') }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS Global -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">

  {% block css_extra %}{% endblock %}
</head>

<body>

  {% include 'header.html' %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include 'footer.html' %}

  <script>
    // Reveal animation
    document.addEventListener("DOMContentLoaded", () => {
      const els = document.querySelectorAll(".reveal");
      if (!els.length) return;

      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      els.forEach((el) => observer.observe(el));
    });
  </script>

  <script>
    // Header scroll effect
    document.addEventListener("DOMContentLoaded", () => {
      const header = document.querySelector(".header");
      if (!header) return;

      const onScroll = () => {
        if (window.scrollY > 50) header.classList.add("scrolled");
        else header.classList.remove("scrolled");
      };

      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    });
  </script>

</body>
</html>
